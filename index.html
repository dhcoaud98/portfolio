<head>

<meta property="og:title" content="오채명 | HR · 교육 운영 포트폴리오">
<meta property="og:description" content="기업 AX 교육 실습 지원 · 현장 운영 · HRD 전문가 1급 · 교육 · 개발 · 서비스 현장 경험">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script>try{var t=localStorage.getItem('palette');if(t!=='navy')document.documentElement.setAttribute('data-palette','green')}catch(e){document.documentElement.setAttribute('data-palette','green')}</script>
</head>
<body>
<a class="skip" href="#app">본문 바로가기</a>
<header class="nav">
  <div class="wrap nav-in">
    <a href="/" data-link class="brand">오채명</a>
    <nav class="menu" id="menu" aria-label="주요 메뉴"></nav>
    <div class="palette" role="group" aria-label="색 테마">
      <button type="button" data-pal="navy" style="--sw:#1F3A5F" aria-label="네이비 테마" title="네이비"></button>
      <button type="button" data-pal="green" style="--sw:#1E4D47" aria-label="딥 그린 테마" title="딥 그린"></button>
    </div>
    <button class="btn sm" type="button" id="pdfBtn">PDF 저장</button>
  </div>
</header>
<p class="madewith wrap">이 포트폴리오는 Claude Code로 설계하고 GitHub · Vercel로 배포했으며, 노션과 실시간 연동됩니다.</p>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot-in" id="foot"></div>
</footer>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>

<script src="/assets/content.js"></script>
<script src="/assets/app.js"></script>
<script>
// 색 테마 전환 (네이비 / 딥 그린) — 선택은 방문자 브라우저에 저장
(function () {
  var root = document.documentElement;
  var btns = document.querySelectorAll('.palette [data-pal]');
  function set(p) {
    if (p === 'green') root.setAttribute('data-palette', 'green'); else root.removeAttribute('data-palette');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', p === 'green' ? '#1E4D47' : '#1F3A5F');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-pal') === p)); });
    try { localStorage.setItem('palette', p); } catch (e) {}
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-pal')); }); });
  set(root.getAttribute('data-palette') === 'green' ? 'green' : 'navy');
})();
</script>
</body>
</html>
